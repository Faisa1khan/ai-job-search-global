[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-global"
version = "1.0.0"
description = "Autonomous AI Job Search & Application Pipeline Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Doe", email = "user@example.com" }
]
dependencies = [
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-subtests>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
